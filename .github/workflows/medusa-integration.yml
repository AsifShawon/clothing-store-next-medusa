name: Medusa Backend & Fullstack Integration

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/backend/**"
      - ".github/workflows/medusa-integration.yml"

jobs:
  medusa-integration:
    name: Medusa Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: medusa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm 10.11.1
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
          run_install: false

      - name: Setup Node.js 20.19.0 with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run Backend Integration HTTP Tests
        run: pnpm --filter @dtc/backend run test:integration:http
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/medusa_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_32_characters_long_ci
          COOKIE_SECRET: test_cookie_secret_32_chars_ci
