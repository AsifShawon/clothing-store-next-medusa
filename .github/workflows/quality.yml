name: Quality, Build & Docker Validation

on:
  push:
    branches: [main, "refactor/*", "feat/*"]
  pull_request:
    branches: [main]

jobs:
  static-quality:
    name: Monorepo Quality, Tests & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm 10.11.1
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
          run_install: false

      - name: Setup Node.js 20.19.0 with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify pnpm version
        run: |
          PNPM_VER=$(pnpm --version)
          echo "Installed pnpm: $PNPM_VER"
          if [ "$PNPM_VER" != "10.11.1" ]; then
            echo "Error: Expected pnpm 10.11.1, found $PNPM_VER"
            exit 1
          fi

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Verify Architecture & Shared UI Consumption
        run: pnpm run check:architecture

      - name: Type Check Workspace (Backend, Storefront, UI, Contracts, Demo)
        run: pnpm run type-check

      - name: Lint Workspace
        run: pnpm run lint

      - name: Run Backend Unit Tests
        run: pnpm --filter @dtc/backend run test:unit

      - name: Run Production Storefront Unit & Integration Tests
        run: pnpm --filter @dtc/storefront run test:unit

      - name: Shared Storefront UI Transition Tests
        run: pnpm --filter @dtc/storefront-ui test

      - name: Portfolio Demo Unit & Storage Tests
        run: pnpm run demo:test

      - name: Build Portfolio Demo (Static Export)
        run: pnpm run demo:build

      - name: Build Production Storefront
        run: pnpm --filter @dtc/storefront run build
        env:
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_test_key_for_static_build
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
          SKIP_ENV_CHECK: "true"

      - name: Build Production Backend
        run: pnpm --filter @dtc/backend run build

      - name: Dependency Security Audit
        run: pnpm audit --prod --audit-level=critical
        continue-on-error: true

      - name: Install Playwright Chromium Browser
        run: npx playwright install chromium --with-deps

      - name: Run Portfolio Demo Playwright Tests
        run: pnpm --filter @dtc/portfolio-demo run test:e2e --project=chromium

      - name: Run Storefront Playwright E2E Tests
        run: pnpm --filter @dtc/storefront run test:e2e --project=chromium
        env:
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_test_ci_e2e_key
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/portfolio-demo/playwright-report/
            apps/storefront/test-results.json
          retention-days: 7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          tags: londonboy/backend:test

      - name: Build Storefront Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/storefront/Dockerfile
          push: false
          tags: londonboy/storefront:test
          build-args: |
            NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=pk_test_ci_docker_build_key

      - name: Verify Clean Repository & No Whitespace Errors
        run: git diff --check
