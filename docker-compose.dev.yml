# ==============================================================================
# LOCAL DEVELOPMENT DOCKER COMPOSE
# Starts PostgreSQL 16 and Redis 7 for local Medusa development.
# Run: docker compose -f docker-compose.dev.yml up -d
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: medusa-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medusa-backend
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medusa-backend"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medusa-dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
    name: medusa_dev_postgres_data
  redis_dev_data:
    name: medusa_dev_redis_data
